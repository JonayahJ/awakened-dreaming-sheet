name: Release

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp download link into module.json
        if: steps.v.outputs.exists == 'false'
        run: |
          jq --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.v.outputs.version }}/module.zip" \
             '.download = $d' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        if: steps.v.outputs.exists == 'false'
        run: zip -r module.zip module.json scripts templates styles fonts lang README.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            module.json
            module.zip
          generate_release_notes: true
